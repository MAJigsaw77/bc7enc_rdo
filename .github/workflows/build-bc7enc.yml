name: Build bc7enc

on:
  workflow_dispatch:

jobs:
  Windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc

      - name: Compiling
        shell: msys2 {0}
        run: make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bc7enc-windows-x86_64
          path: bin/bc7enc.exe
          if-no-files-found: error

  Linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM64 Cross Toolchain
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Compiling (x86_64)
        if: matrix.arch == 'x86_64'
        run: make

      - name: Compiling (ARM64)
        if: matrix.arch == 'arm64'
        run: make CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bc7enc-linux-${{ matrix.arch }}
          path: bin/bc7enc
          if-no-files-found: error

  MacOS:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compiling Universal Binary
        run: make universal

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bc7enc-macos-universal
          path: bin/bc7enc
          if-no-files-found: error
